/* ===== header ===== */
.top{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:10px 24px;color:#fff;background:rgba(6,23,58,.9);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-bottom:3px solid var(--gold);box-shadow:0 6px 24px rgba(0,0,0,.35)}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.brand .lg{background:#fff;border-radius:10px;padding:3px 6px;display:block;flex:none;box-shadow:0 2px 10px rgba(0,0,0,.3)}.brand .lg img{height:42px;display:block}
.brand .bn{display:flex;flex-direction:column;line-height:1.2;min-width:0}.brand .bn b{font-size:16px;letter-spacing:.2px;white-space:nowrap}.brand .bn small{color:var(--gold);font-weight:600;font-size:11px;letter-spacing:1.6px;text-transform:uppercase}
.top .wl{color:#cfdcf3;text-decoration:none;font-weight:600;font-size:13px;margin-left:6px;padding:6px 10px;border-radius:8px}.top .wl:hover{background:#ffffff1c;color:#fff}
.sp{flex:1}
.usr{display:flex;align-items:center;gap:10px}.usr .av{width:36px;height:36px;border-radius:50%;background:var(--gold);color:var(--navd);font-weight:700;display:grid;place-items:center;font-size:15px;flex:none}
.usr div{display:flex;flex-direction:column;line-height:1.2}.usr b{font-size:14px}.usr small{color:#b9c9e6;font-size:11.5px}
.hg{background:#ffffff14;border:1px solid #ffffff40;color:#fff;border-radius:8px;padding:7px 12px;font:inherit;font-size:13px;font-weight:600;cursor:pointer}.hg:hover{background:#ffffff2b}

/* ===== tabs ===== */
.tabs{display:flex;gap:8px;max-width:1100px;margin:20px auto 0;padding:0 20px;overflow-x:auto}
.tabs button{flex:none;background:#ffffff14;border:1px solid #ffffff2e;color:#d7e3f8;padding:9px 20px;border-radius:10px;font:inherit;font-weight:600;cursor:pointer;border-bottom:3px solid transparent}
.tabs button:hover{background:#ffffff26;color:#fff}.tabs .on{background:#fff;color:var(--navy);border-bottom-color:var(--gold)}

main{max-width:1100px;margin:0 auto;padding:20px}

/* ===== welcome banner ===== */
.welcome{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;color:#fff;margin:4px 0 22px}
.welcome .eb{margin:0 0 2px;color:var(--gold);font-weight:700;font-size:12px;letter-spacing:3px;text-transform:uppercase}
.welcome h1{margin:0;font-size:30px;line-height:1.2;letter-spacing:-.4px}.welcome h1 span{color:var(--gold)}
.welcome p{margin:4px 0 0;color:#cfdcf3;font-size:14px}
.welcome .dt{background:#ffffff14;border:1px solid #ffffff2e;border-radius:12px;padding:8px 14px;font-size:13px;font-weight:600;color:#e6edf7}

/* ===== cards, stats, tables, controls ===== */
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:20px;margin-bottom:16px;box-shadow:0 10px 30px rgba(3,10,30,.3)}
.card h3{margin:0 0 14px;font-size:16px;display:flex;align-items:center;gap:9px}.card h3::before{content:"";width:4px;height:17px;border-radius:2px;background:var(--gold)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin-bottom:16px}
.stat{background:var(--card);border:1px solid var(--bd);border-left:4px solid var(--gold);border-radius:12px;padding:14px 16px;box-shadow:0 8px 22px rgba(3,10,30,.25)}.stat b{display:block;font-size:28px;line-height:1.2}.stat span{color:var(--mu);font-size:13px;font-weight:500}
.b{background:var(--ac);color:#fff;border:0;border-bottom:3px solid var(--gold);border-radius:8px;padding:8px 15px;font:inherit;font-weight:600;cursor:pointer}.b:hover{filter:brightness(1.15)}
.g{background:none;border:1px solid var(--bd);color:var(--tx);border-radius:8px;padding:6px 12px;font:inherit;font-weight:600;cursor:pointer}.g:hover{border-color:var(--gold);background:var(--soft)}
button:disabled{opacity:.45;cursor:not-allowed;filter:none}
input,select{font:inherit;padding:9px 11px;border:1px solid var(--bd);border-radius:8px;background:var(--soft);color:var(--tx)}input:focus,select:focus{outline:2px solid var(--gold);outline-offset:0}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:end}.row label{display:flex;flex-direction:column;font-size:12px;color:var(--mu);gap:3px;font-weight:600}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:14px}th,td{padding:10px 12px;border-bottom:1px solid var(--bd);text-align:left;white-space:nowrap}
th{color:var(--mu);font-size:11.5px;text-transform:uppercase;letter-spacing:.8px;background:var(--soft)}tbody tr:hover td,tr:hover>td{background:var(--soft)}
.P{color:var(--ok)}.A{color:var(--bad)}.L{color:var(--wn)}.tag{font-weight:700;font-size:12px;border:1px solid;border-radius:99px;padding:2px 10px}
main>.row label{color:#cfdcf3}.tag{margin-right:6px}
.err{color:var(--bad);min-height:20px;font-size:13px}.card.err{min-height:0}.hint{font-size:12px;color:var(--mu)}

/* ===== footer ===== */
.pf{max-width:1100px;margin:6px auto 0;padding:22px 20px 34px;display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap;color:#9fb6dc;font-size:12.5px;text-align:center;border-top:1px solid #ffffff1f}
.pf .lg{background:#fff;border-radius:8px;padding:2px 5px;display:block}.pf .lg img{height:28px;display:block}.pf b{color:#fff}.pf em{font-style:normal;color:var(--gold);letter-spacing:2px;font-weight:700;font-size:11px}

/* ===== payslip (always white, printable) ===== */
.modal{position:fixed;inset:0;background:rgba(3,10,30,.7);overflow:auto;display:flex;justify-content:center;padding:20px;z-index:9}
.slip{background:#fff;color:#111;width:100%;max-width:700px;border-radius:12px;padding:26px;align-self:flex-start;border-top:6px solid var(--navy);box-shadow:0 20px 60px rgba(0,0,0,.5)}
.slip td,.slip th{color:#111;border-color:#ddd;background:none}.slip th{background:#f1f5fb;color:#334}.slip tr:hover>td{background:none}
.slip .hd{display:flex;justify-content:space-between;align-items:center;gap:14px;border-bottom:3px solid var(--gold);padding-bottom:12px;margin-bottom:14px}
.slip .hd .co{display:flex;align-items:center;gap:12px}.slip .hd .co img{height:56px;display:block}.slip .hd h3{margin:0;color:var(--navy);font-size:17px}.slip .hd h3::before{display:none}
.slip .net{background:#ecf3ff;border-left:5px solid var(--gold);padding:10px 12px;font-weight:700;text-align:right;margin-top:12px;color:var(--navy);-webkit-print-color-adjust:exact;print-color-adjust:exact}
.slip .g{color:#111}
@media print{body *{visibility:hidden}.slip,.slip *{visibility:visible}.modal{position:static;padding:0;background:none}.slip{position:absolute;left:0;top:0;box-shadow:none;border-radius:0}.np{display:none!important}body.in{background:#fff}.scene{display:none!important}}

@media(max-width:860px){.top{padding:10px 14px}.brand .bn b{font-size:13.5px;white-space:normal}.brand .lg img{height:34px}.usr small{display:none}.welcome h1{font-size:24px}.tabs{margin-top:14px;padding:0 14px}main{padding:14px}}
@media(max-width:520px){.top .wl{display:none}.hg{padding:6px 9px;font-size:12px}}

/* ===== login screen (unchanged) ===== */
.auth{display:grid;grid-template-columns:1.15fr 1fr;min-height:100vh}
.hero{background:#0b2a5e var(--art) center/cover no-repeat;color:#fff;display:flex;flex-direction:column;justify-content:center;padding:56px 64px;position:relative}
.hero h1{font-size:40px;line-height:1.15;margin:0 0 14px;letter-spacing:-.5px}.hero h1 span{color:#e8a41c}
.hero p{max-width:460px;color:#cfdcf3;font-size:16px;margin:0 0 28px}
.hero ul{list-style:none;padding:0;margin:0;display:grid;gap:12px}
.hero li{display:flex;gap:12px;align-items:center;font-weight:600}.hero li i{width:34px;height:34px;border-radius:10px;background:#ffffff1c;border:1px solid #ffffff33;display:grid;place-items:center;font-style:normal}
.tag4{margin-top:34px;font-size:12px;letter-spacing:3px;color:#e8a41c;font-weight:700}
.panel{display:flex;align-items:center;justify-content:center;padding:32px;background:var(--bg)}
.box{width:100%;max-width:400px}.box .lg{background:#fff;border-radius:14px;padding:10px;display:block;margin:0 auto 22px;width:190px;box-shadow:0 6px 24px #0b2a5e22}.box .lg img{width:100%;display:block}
.box h2{margin:0 0 4px;font-size:24px;text-align:center}.box .sub{color:var(--mu);text-align:center;margin:0 0 20px}
.box input{width:100%;margin-bottom:12px;padding:11px 12px}.box .go{width:100%;padding:11px;background:#0b2a5e;color:#fff;border:0;border-radius:8px;font:inherit;font-weight:700;cursor:pointer;border-bottom:3px solid #e8a41c}.box .go:hover{background:#12397d}
.box .foot{margin-top:16px;text-align:center;font-size:13px}.box .foot a{color:#0b2a5e;font-weight:600}.box .demo{margin-top:12px;font-size:11px;color:var(--mu);text-align:center}
@media(prefers-color-scheme:dark){.box .foot a{color:#9cc2ff}}
@media(max-width:860px){.auth{grid-template-columns:1fr}.hero{padding:28px 24px}.hero h1{font-size:26px}.hero p,.hero ul{display:none}.tag4{margin-top:0}.panel{align-items:flex-start;padding:24px 16px}}
.slip.inv{max-width:780px;padding:0;border:1.5px solid #111;border-radius:0;font-size:13px;color:#111}
.inv .ih{display:flex;align-items:center;gap:16px;padding:12px 16px;border-bottom:1.5px solid #111}.inv .ih img{height:58px;display:block}.inv .ih div{flex:1;text-align:center}.inv .ih h3{margin:0;font-size:20px;color:#111}.inv .ih p{margin:2px 0 0;font-size:11px;color:#333}
.inv .it{text-align:center;font-weight:700;padding:7px;border-bottom:1.5px solid #111;font-size:14px}
.inv table.ig{width:100%;border-collapse:collapse;margin:0}.inv .ig th,.inv .ig td{border:1px solid #111;padding:5px 8px;text-align:left;white-space:normal;font-size:12.5px;background:none;text-transform:none;letter-spacing:0;color:#111}.inv .ig th{font-weight:700}.inv .ig .r{text-align:right}.inv .tt td{font-weight:700}
.inv .nt{margin-top:16px!important}.inv .nt td{background:#e6f1e1;font-weight:700;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.inv .ia{text-align:right;padding:36px 16px 8px;font-size:12px}.inv .if{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:8px 16px;border-top:1px solid #111;font-size:10.5px;color:#333}.inv .np{padding:12px 16px}
@media print{@page{size:A4;margin:0}.slip.inv{margin:10mm;width:calc(100% - 20mm);max-width:none;box-shadow:none}}

function open_(i){modal=slip(cache.slips[i],cache.users?cache.users.find(u=>u.userId===cache.slips[i].userCode):me);draw()}
async function empPay(){cache.slips=await api('/api/payslips/me');cache.users=[me];
 return`<div class="card tw"><h3>My payslips</h3><table><tr><th>Month</th><th>Paid days</th><th>Gross</th><th>Net pay</th><th></th></tr>${cache.slips.map((p,i)=>`<tr><td>${ml(p.payMonth)}</td><td>${p.paidDays}/${p.workingDays}</td><td>${inr(p.gross)}</td><td><b>${inr(p.net)}</b></td><td><button class="b" onclick="open_(${i})">View</button></td></tr>`).join('')||'<tr><td colspan=5>No payslips yet – generated automatically at month end.</td></tr>'}</table></div>`}
async function adminAtt(){const[u,a]=await Promise.all([api('/api/admin/users'),api('/api/admin/attendance?date='+date)]);
 return`<div class="card"><h3>Attendance register</h3><div class="row" style="margin-bottom:12px"><label>Date<input type="date" value="${date}" onchange="date=this.value;draw()"></label></div><div class="tw"><table><tr><th>ID</th><th>Name</th><th>Type</th><th>Status</th><th>In / Out</th><th>Mark</th></tr>${u.filter(x=>x.role!=='ADMIN').map(x=>{const r=a.find(y=>y.userCode===x.userId);return`<tr><td>${x.userId}</td><td>${esc(x.name)}</td><td>${x.role}</td><td>${r?tag(r.status):'–'}</td><td>${r?(r.checkIn||'–')+' / '+(r.checkOut||'–'):'–'}</td><td>${['P','L','A'].map(s=>`<button class="g" onclick="setAtt('${x.userId}','${s}')">${s}</button>`).join(' ')}</td></tr>`}).join('')}</table></div></div>`}
async function setAtt(userCode,status){try{await api('/api/admin/attendance','PUT',{userCode,date,status})}catch(e){alert(e.message)}draw()}
async function people(){const u=await api('/api/admin/users');
 return`<div class="card"><h3>Add student / intern / employee</h3><div class="row"><label>Name<input id="n1"></label><label>Type<select id="n2"><option value="STUDENT">Student</option><option value="INTERN">Intern</option><option value="EMPLOYEE">Employee</option></select></label><label>Branch<select id="n3" onchange="prev()"><option>Tirupati</option><option>Bengaluru</option><option>Nellore</option></select></label><label>Course / Domain / Designation<input id="n4"></label><label>Annual CTC ₹ (employees)<input id="n5" type="number" oninput="prev()" placeholder="e.g. 1500000"></label><label>UAN (employees)<input id="n7" maxlength="12" inputmode="numeric" placeholder="12-digit UAN"></label><label>Password<input id="n6" value="welcome123"></label><button class="b" onclick="addUser()">Add</button></div><div id="prev" style="margin-top:12px"></div></div>
 <div class="card tw"><table><tr><th>ID</th><th>Name</th><th>Type</th><th>Branch</th><th>Course / Role</th><th>Annual CTC</th><th>UAN</th></tr>${u.filter(x=>x.role!=='ADMIN').map(x=>`<tr><td>${x.userId}</td><td>${esc(x.name)}</td><td>${x.role}</td><td>${esc(x.branch)}</td><td>${esc(x.course||x.designation)}</td><td>${x.annualCtc?inr(x.annualCtc):'–'}</td><td>${esc(x.uan||'–')}</td></tr>`).join('')}</table></div>`}
async function prev(){const c=+$('n5').value,el=$('prev');if(!c){el.innerHTML='';return}try{const b=await api('/api/admin/salary/preview?ctc='+c+'&branch='+encodeURIComponent($('n3').value));el.innerHTML=`<div class="tw"><table><tr><th colspan=2>Monthly breakup for ${(c/100000).toFixed(2)} LPA</th><th colspan=2>Deductions</th></tr><tr><td>Basic</td><td>${inr(b.basic)}</td><td>Employee PF</td><td>${inr(b.employeePf)}</td></tr><tr><td>HRA</td><td>${inr(b.hra)}</td><td>Professional tax</td><td>${inr(b.pt)}</td></tr><tr><td>Special allowance</td><td>${inr(b.special)}</td><td>Income tax (TDS, new regime)</td><td>${inr(b.tds)}</td></tr><tr><td><b>Gross</b></td><td><b>${inr(b.gross)}</b></td><td><b>Net take-home</b></td><td><b>${inr(b.net)}</b></td></tr></table></div><p class="hint">Also part of CTC but not paid monthly: employer PF ${inr(b.employerPf)}, gratuity ${inr(b.gratuity)}${b.insurance?', insurance '+inr(b.insurance):''}.</p>`}catch(e){el.innerHTML='<span class="err">'+esc(e.message)+'</span>'}}
async function addUser(){const t=$('n2').value,pw=$('n6').value||'welcome123';try{const u=await api('/api/admin/users','POST',{name:$('n1').value,role:t,branch:$('n3').value,course:t!=='EMPLOYEE'?$('n4').value:null,designation:t==='EMPLOYEE'?$('n4').value:null,annualCtc:+$('n5').value||null,uan:t==='EMPLOYEE'?($('n7').value.trim()||null):null,password:pw});alert('Account created.\nUser ID: '+u.userId+'\nTemporary password: '+pw+'\nShare these with the user. They can change the password after signing in.')}catch(e){alert(e.message)}draw()}
async function chpw(){const o=prompt('Current password');if(o===null)return;const n=prompt('New password (minimum 6 characters)');if(!n)return;try{await api('/api/me/password','PUT',{oldPassword:o,newPassword:n});alert('Password changed.')}catch(e){alert(e.message)}}
async function adminPay(){const[u,s]=await Promise.all([api('/api/admin/users'),api('/api/admin/payslips?month='+month)]);cache.slips=s;cache.users=u;
 return`<div class="card"><h3>Payroll</h3><div class="row"><label>Month<input type="month" value="${month}" onchange="month=this.value;draw()"></label><button class="b" onclick="runPay()">Generate / regenerate payslips</button></div><p class="hint">Payslips are also generated automatically at 23:55 IST on the last day of each month.</p></div>
 <div class="card tw"><table><tr><th>ID</th><th>Name</th><th>Paid days</th><th>Gross</th><th>Deductions</th><th>Net pay</th><th></th></tr>${s.map((p,i)=>{const x=u.find(y=>y.userId===p.userCode)||{};return`<tr><td>${p.userCode}</td><td>${esc(x.name)}</td><td>${p.paidDays}/${p.workingDays}</td><td>${inr(p.gross)}</td><td>${inr(+p.pf+ +p.pt+ +p.tds)}</td><td><b>${inr(p.net)}</b></td><td><button class="b" onclick="open_(${i})">Payslip</button></td></tr>`}).join('')||'<tr><td colspan=7>No payslips for this month.</td></tr>'}</table></div>`}
async function runPay(){try{const r=await api('/api/admin/payroll/run?month='+month+'&force=true','POST');alert(r.generated+' payslip(s) generated')}catch(e){alert(e.message)}draw()}
draw();
