[build]
  publish = "."

# The browser talks to /api on this site; Netlify forwards it to the backend.
# To change the backend address, edit ONLY the "to" line below and redeploy.
[[redirects]]
  from = "/api/*"
  to = "https://ntshrms-production-492e9d30.up.railway.app/api/:splat"
  status = 200
  force = true

# Friendly addresses -> the portal page
[[redirects]]
  from = "/login"
  to = "/login.html"
  status = 200

[[redirects]]
  from = "/portal"
  to = "/login.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
