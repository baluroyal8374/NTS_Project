# Replace /etc/nginx/sites-available/narayanadritechnology.com with this file, then:
#   sudo nginx -t && sudo systemctl reload nginx   (certbot's HTTPS lines are kept if you edit in place instead)
limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=visit:10m rate=30r/m;

server {
    listen 80;
    server_name narayanadritechnology.com www.narayanadritechnology.com;
    root /var/www/narayanadritechnology.com;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location = /api/auth/login {
        limit_req zone=login burst=5 nodelay;
        proxy_pass http://127.0.0.1:9091;
        proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-Proto $scheme;
    }
    # visitor counter: rate-limited so the number cannot be inflated by scripts
    location = /api/public/visit {
        limit_req zone=visit burst=5 nodelay;
        proxy_pass http://127.0.0.1:9091;
        proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /api/ {
        proxy_pass http://127.0.0.1:9091;
        proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /login  { try_files /login.html =404; }
    location = /portal { try_files /login.html =404; }
    location / { try_files $uri $uri/ =404; }
}
